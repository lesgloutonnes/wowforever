<!doctype html>
<html lang="fr" data-theme="alliance">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1220" />
    <title>Forge des talents</title>
    <meta
      name="description"
      content="Planifiez un build de talents pour les neuf classes. Comparez Classic, enregistrez et partagez chaque point."
    />
    <link rel="icon" type="image/jpeg" href="/icons/class_warrior.jpg" />
    <script>
      (function () {
        var t = "alliance";
        try {
          var s = localStorage.getItem("wowforever:theme");
          if (s === "horde" || s === "alliance") t = s;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
